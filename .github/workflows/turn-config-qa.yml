name: SERA TURN Deployment Configuration QA
on:
  push:
    branches: [main]
    paths: ['infra/turn/**', '.github/workflows/turn-config-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify restricted configuration generation
        run: python3 infra/turn/test_turn_config.py
