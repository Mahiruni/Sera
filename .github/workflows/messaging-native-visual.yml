name: SERA Native Messaging Visual Regression
on:
  push:
    branches: [main]
    paths:
      - 'android-native/app/src/main/java/et/sera/nativeapp/SeraChatDesign.kt'
      - 'android-native/app/src/main/java/et/sera/nativeapp/SeraNativeMessageRow.kt'
      - 'android-native/app/src/main/java/et/sera/nativeapp/SeraMessageLibrary.kt'
      - 'android-native/app/src/main/java/et/sera/nativeapp/SeraChatVoice.kt'
      - 'android-native/app/src/main/java/et/sera/nativeapp/SeraCompactMessageBubble.kt'
      - 'android-native/app/src/main/java/et/sera/nativeapp/SeraNativeInbox.kt'
      - 'android-native/app/src/main/java/et/sera/nativeapp/SeraNativeComposer.kt'
      - 'android-native/app/src/main/java/et/sera/nativeapp/SeraMessageInput.kt'
      - 'android-native/app/src/main/java/et/sera/nativeapp/SeraPendingText.kt'
      - 'android-native/app/src/main/java/et/sera/nativeapp/SeraThreadRendering.kt'
      - 'android-native/app/src/main/java/et/sera/nativeapp/SeraMessageAlerts.kt'
      - 'android-native/app/src/main/java/et/sera/nativeapp/SeraForegroundMessageBanner.kt'
      - 'android-native/app/src/main/java/et/sera/nativeapp/SeraReceiptVisibility.kt'
      - 'android-native/app/src/main/java/et/sera/nativeapp/SeraChatOutbox.kt'
      - 'android-native/app/src/main/java/et/sera/nativeapp/SeraChatPlayback.kt'
      - 'android-native/app/src/main/java/et/sera/nativeapp/MainActivity.kt'
      - 'android-native/app/src/androidTest/**'
      - '.github/workflows/messaging-native-visual.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-native/**'
      - '.github/workflows/messaging-native-visual.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      live_calling:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Reserve CI compiler heap
        shell: bash
        run: |
          total_gib=$(awk '/MemTotal/ {print int($2/1048576)}' /proc/meminfo)
          heap=$((total_gib - 4))
          if (( heap > 12 )); then heap=12; fi
          if (( heap < 2 )); then echo '::error::Insufficient build memory'; exit 1; fi
          sed -i "s/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx${heap}g -Dfile.encoding=UTF-8/" android-native/gradle.properties
          echo "CI build memory: ${total_gib} GiB host, ${heap} GiB Gradle heap"
      - name: Compile app and instrumentation APK before starting emulator
        run: gradle -p android-native :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=1 -PSERA_ENABLE_LIVE_CALLING=${{ inputs.live_calling || false }}
      - name: Reduce Gradle heap for emulator test execution
        run: sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8/' android-native/gradle.properties
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render and measure native production bubble components
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle -p android-native :app:connectedDebugAndroidTest --no-daemon --max-workers=1 -PSERA_ENABLE_LIVE_CALLING=${{ inputs.live_calling || false }}
            mkdir -p native-messaging-qa
            adb exec-out run-as et.sera.nativeapp cat files/messaging-qa/compact-bubbles.png > native-messaging-qa/compact-bubbles.png
            test -s native-messaging-qa/compact-bubbles.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-messaging-visual-qa
          path: |
            native-messaging-qa/
            android-native/app/build/reports/androidTests/
          retention-days: 7
