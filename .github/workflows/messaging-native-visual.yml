name: SERA Native Messaging Visual Regression
on:
  push:
    branches: [main]
    paths:
      - 'android-native/app/src/main/java/et/sera/nativeapp/SeraCompactMessageBubble.kt'
      - 'android-native/app/src/main/java/et/sera/nativeapp/SeraNativeInbox.kt'
      - 'android-native/app/src/main/java/et/sera/nativeapp/SeraChatPlayback.kt'
      - 'android-native/app/src/main/java/et/sera/nativeapp/MainActivity.kt'
      - 'android-native/app/src/androidTest/**'
      - '.github/workflows/messaging-native-visual.yml'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render and measure native production bubble components
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            cd android-native
            gradle :app:connectedDebugAndroidTest --no-daemon
            mkdir -p ../native-messaging-qa
            adb exec-out run-as et.sera.nativeapp cat files/messaging-qa/compact-bubbles.png > ../native-messaging-qa/compact-bubbles.png
            test -s ../native-messaging-qa/compact-bubbles.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-messaging-visual-qa
          path: |
            native-messaging-qa/
            android-native/app/build/reports/androidTests/
          retention-days: 7
