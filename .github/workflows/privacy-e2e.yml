name: SERA privacy E2E
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SERA_E2E_BASE_URL: ${{ secrets.SERA_E2E_BASE_URL }}
      SERA_E2E_OWNER_ID: ${{ secrets.SERA_E2E_OWNER_ID }}
      SERA_E2E_OWNER_EMAIL: ${{ secrets.SERA_E2E_OWNER_EMAIL }}
      SERA_E2E_OWNER_PASSWORD: ${{ secrets.SERA_E2E_OWNER_PASSWORD }}
      SERA_E2E_CONNECTED_EMAIL: ${{ secrets.SERA_E2E_CONNECTED_EMAIL }}
      SERA_E2E_CONNECTED_PASSWORD: ${{ secrets.SERA_E2E_CONNECTED_PASSWORD }}
      SERA_E2E_UNRELATED_EMAIL: ${{ secrets.SERA_E2E_UNRELATED_EMAIL }}
      SERA_E2E_UNRELATED_PASSWORD: ${{ secrets.SERA_E2E_UNRELATED_PASSWORD }}
      SERA_E2E_BLOCKED_EMAIL: ${{ secrets.SERA_E2E_BLOCKED_EMAIL }}
      SERA_E2E_BLOCKED_PASSWORD: ${{ secrets.SERA_E2E_BLOCKED_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Browser privacy verification
        run: npx playwright test tests/e2e/privacy.spec.ts --project=chromium
      - name: Upload failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-e2e-results
          path: test-results/
          retention-days: 7
