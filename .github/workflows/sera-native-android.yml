name: SERA Native Android
on:
  push:
    branches: [main]
    paths:
      - 'android-native/**'
      - '.github/workflows/sera-native-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android SDK command-line tools not found at $SDKMANAGER"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile native debug APK
        working-directory: android-native
        env:
          SERA_URL: https://okegwojigrtxadvgxpwm.supabase.co
          SERA_PUBLIC_KEY: ${{ secrets.SERA_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SERA_URL" ] || [ -z "$SERA_PUBLIC_KEY" ]; then
            echo "::error::Supabase public configuration is missing. Set SERA_SUPABASE_URL and SERA_SUPABASE_ANON_KEY in GitHub Actions settings."
            exit 1
          fi
          case "$SERA_URL" in https://*.supabase.co) ;; *) echo "::error::Invalid Supabase URL"; exit 1 ;; esac
          gradle :app:assembleDebug --no-daemon -PSERA_SUPABASE_URL="$SERA_URL" -PSERA_SUPABASE_ANON_KEY="$SERA_PUBLIC_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: SERA-Native-Phase1-debug-apk
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
